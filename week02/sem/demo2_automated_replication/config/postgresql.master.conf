# Минимальный конфиг под физическую репликацию.
# Всё, что не про репликацию, оставлено по умолчанию: тюнинг памяти -
# отдельная тема, и в демо он только мешает.

# Каталог с данными и файл правил доступа задаём явно: конфиг лежит вне PGDATA.
data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/etc/postgresql/pg_hba.conf'

listen_addresses = '*'

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------
# сколько информации пишем в WAL:
#   minimal - только для crash recovery, реплику не поднять
#   replica - достаточно для физической репликации и архивирования  <-- нам сюда
#   logical - плюс информация для логического декодирования (демо 0)
# Для ФИЗИЧЕСКОЙ репликации logical не нужен: он только раздувает WAL.
wal_level = replica

#------------------------------------------------------------------------------
# REPLICATION
#------------------------------------------------------------------------------
# сколько процессов walsender разрешено, т.е. сколько реплик/бэкапов
# одновременно могут тянуть WAL
max_wal_senders = 10

# слоты репликации: мастер не удалит WAL, пока реплика его не забрала.
# Обратная сторона: если реплика умерла и не вернулась - pg_wal распухнет и
# заполнит диск. Поэтому в проде обязателен max_slot_wal_keep_size.
max_replication_slots = 10
max_slot_wal_keep_size = 1GB

# на standby разрешаем читающие запросы во время восстановления
hot_standby = on

# standby сообщает мастеру, какие снапшоты ему ещё нужны, чтобы мастер
# не вакуумировал строки из-под длинных читающих запросов на реплике.
# Плата: раздувание таблиц на мастере из-за задержанного vacuum.
hot_standby_feedback = on

# Сколько реплика готова задержать накат WAL, чтобы не убивать читающий запрос.
# Дефолт - 30s. Для демо конфликтов восстановления (см. README, шаг 6) укорочен,
# чтобы на паре не ждать полминуты. В проде это ручка, которой торгуют
# "свежесть реплики" против "живучести длинных запросов".
max_standby_streaming_delay = 5s

# лог для наглядности на семинаре
log_connections = on
log_replication_commands = on
