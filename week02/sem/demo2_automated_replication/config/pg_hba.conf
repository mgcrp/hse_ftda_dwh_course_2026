# ВНИМАНИЕ: конфиг учебный. "all all all" в проде - недопустимо.
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# обычные подключения из docker-сети
host    all             all             all                     scram-sha-256

# ОТДЕЛЬНАЯ строка для репликации: "database = replication" - это не имя базы,
# а специальное ключевое слово. Без неё pg_basebackup и walreceiver не пройдут.
host    replication     replicator      all                     scram-sha-256
