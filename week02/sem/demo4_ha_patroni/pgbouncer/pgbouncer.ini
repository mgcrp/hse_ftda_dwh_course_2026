[databases]
;; Единая точка входа для приложения. Пул смотрит НЕ в конкретный узел,
;; а в HAProxy, который всегда указывает на текущего лидера.
app     = host=haproxy port=5005 dbname=postgres
;; Отдельная "база" для читающей нагрузки - уезжает на реплики.
app_ro  = host=haproxy port=5001 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 10

;; Короткая жизнь серверного коннекта: после failover пул быстрее переедет
;; на нового лидера, а не будет держать умершие соединения.
server_lifetime = 120
server_idle_timeout = 60
server_login_retry = 2
query_wait_timeout = 30

ignore_startup_parameters = extra_float_digits,options
