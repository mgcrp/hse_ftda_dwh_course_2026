;; Демо-конфиг PgBouncer.
;; Всё, что важно на семинаре, - в секции [pgbouncer].

[databases]
;; Клиент говорит "хочу базу shop", pgbouncer сам знает, куда идти.
;; Так же тут можно спрятать реальный хост/порт - клиент их не видит.
shop = host=postgres port=5432 dbname=shop

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; --- Аутентификация -------------------------------------------------------
;; plain + userlist.txt - самый читаемый вариант для демо.
;; В проде так НЕ делают: используют auth_type = scram-sha-256 и auth_query,
;; чтобы pgbouncer сам ходил в базу за хэшем пароля (см. закомментированное ниже).
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
; auth_type = scram-sha-256
; auth_user = pgbouncer_auth
; auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1

;; --- Главные ручки --------------------------------------------------------
;; pool_mode:
;;   session     - серверный коннект держится за клиентом до отключения (безопасно, но не экономит)
;;   transaction - серверный коннект отдаётся на время транзакции (то, что нужно в 95% случаев)
;;   statement   - отдаётся на каждый запрос, autocommit-only (редко)
pool_mode = transaction

;; Сколько клиентов pgbouncer готов принять на себя.
max_client_conn = 1000

;; Сколько РЕАЛЬНЫХ коннектов к postgres он при этом откроет на пару (db, user).
;; 1000 клиентов -> 5 бэкендов в базе. В этом весь фокус.
default_pool_size = 5

;; Аварийный запас поверх пула (для всплесков).
reserve_pool_size = 2
reserve_pool_timeout = 3

;; Сколько клиент готов ждать свободный серверный коннект, прежде чем получить ошибку.
query_wait_timeout = 30

;; Гигиена соединений.
server_idle_timeout = 60
server_lifetime = 300

;; Кто может открывать админ-консоль (psql -d pgbouncer) и смотреть SHOW POOLS.
admin_users = postgres
stats_users = postgres

;; Параметры, которые драйверы шлют при коннекте и которые pgbouncer не умеет
;; прокидывать в transaction mode - просто игнорируем.
ignore_startup_parameters = extra_float_digits,options

;; Нужно для prepared statements в transaction mode (PgBouncer >= 1.21).
max_prepared_statements = 200

log_connections = 1
log_disconnections = 1
